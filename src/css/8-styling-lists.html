<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling Lists</title>
    <link rel = "stylesheet" href="8-styling-lists.css">

</head>
<body>
    <header>
        <h1>Css Lists</h1>
    </header>
    <main>
        <article>
            <h2>
                Ordered lists(Footballers)
            </h2>
            <ol>
                <li>Lionel Messi</li>
                <li>Cristiano Ronaldo</li>
                <li>Neymar Junior</li>
            </ol>
            <h2>Unordered Lists(football Teams)</h2>
            <ul>
                <li>Liverpool</li>
                <li>Bayern Munich</li>
                <li>Paris Saint German</li>
            </ul>
            <h2>Descriptive lists</h2>
            <dt>BMW</dt>
            <dd>German Machine</dd>
            <dt>Dodge Challenger Hellcat</dt>
            <dd>American Machine</dd>
           <dt>Mercedes Benz</dt>
           <dd>German Machine</dd>
        </article>
    </main>
    
</body>
</html>
