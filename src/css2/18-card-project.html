<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini project- Profile Cards</title>
    <link rel="stylesheet" href="18-card-project.css">
</head>
<body>
    <header>
        <h1>Our Staff</h1>
        <nav>
            <a href="#profile1">Messi</a>
            <a href="#profile2">Cristiano</a>
            <a href="#profile3">Neymar</a>
        </nav>
    </header>

    <main>
        <article id="profile1" class="card">
        <figure>
            <img src="cardprojectimages/messi.webp" alt="Lionel Messi" width="500" height="500">
            <figcaption>Lionel Messi</figcaption>
        </figure>
        <p><q>La Pulga</q></p>
        </article>

        <article id="profile2" class="card">
        <figure>
            <img src="cardprojectimages/ronaldo.jpg" alt="Cristiano Ronaldo" width="500" height="500">
            <figcaption>Cristiano <span class="nowrap">Ronaldo</span></figcaption>
        </figure>
        <p><q>Suiiiiiii</q></p>
        </article>

        <article id="profile3" class="card">
        <figure>
            <img src="cardprojectimages/neymar.webp" alt="Neymar Jr" width="500" height="500">
            <figcaption>Neymar Jr</figcaption>
        </figure>
        <p><q>Magician</q></p>
        </article>
        
    </main>

    <Footer>
        <p>&copy; Bm .co</p>
    </Footer>
    
</body>
</html>
